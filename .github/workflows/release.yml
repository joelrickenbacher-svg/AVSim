name: Release

on:
  push:
    tags: ['AVSim-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="${GITHUB_REF_NAME#AVSim-}"; else V=dev; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Collect release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/AVSim-${VERSION}.apk"
          cp avsim.html "out/avsim_${VERSION}.html"
          zip -qr "out/AVSim-AndroidStudio-${VERSION}.zip" . -x '.git/*' '.github/*' 'dist/*' 'out/*' 'build/*' 'app/build/*' '.gradle/*'
          ls -la out

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AVSim ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
          body: |
            Debug-APK (unsigniert, zum Sideloaden), Standalone-HTML und Android-Studio-Projekt.
            Quellen und Herleitungen der Modellwerte: docs/QUELLEN.md. Heuristisches Trainingsmodell, nicht für den operationellen Einsatz.

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AVSim-build
          path: out/*
