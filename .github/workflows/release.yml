name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Collect release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AVSim-${GITHUB_REF_NAME}.apk
          cp avsim.html dist/avsim_${GITHUB_REF_NAME}.html
          zip -qr dist/AVSim-AndroidStudio.zip . -x '.git/*' '.github/*' 'build/*' 'app/build/*' '.gradle/*'

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AVSim ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AVSim-build
          path: dist/*
